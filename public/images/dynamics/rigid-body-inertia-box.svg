<title>Uniform box with its centre-of-mass frame</title>
<desc>A uniform box with sides a along X, b along Y and c along Z. Frame C sits at its centre; its three coordinate planes (dashed) are planes of symmetry of the box, so every product of inertia is zero.</desc>
