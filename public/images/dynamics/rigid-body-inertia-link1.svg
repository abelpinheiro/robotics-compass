<title>Inertia of link 1 about joint 1</title>
<desc>Link 1 of a planar arm, pivoted at joint 1. Its centre of mass C1, with m1 = 2 kg and I1 = 0.08 kg m^2, lies at l_c1 = 0.5 m from the joint axis. A bar below adds I1 = 0.08 and m1 l_c1^2 = 0.50 to give 0.58 kg m^2.</desc>
