<text x="302.0" y="376.0" fill="#1A1F2B" font-size="16" text-anchor="middle" font-style="italic" font-weight="600">I<tspan baseline-shift="sub" font-size="11">1</tspan> + m<tspan baseline-shift="sub" font-size="11">1</tspan> l<tspan baseline-shift="sub" font-size="11">c1</tspan><tspan baseline-shift="super" font-size="11">2</tspan> = 0.58 kg·m²</text>
