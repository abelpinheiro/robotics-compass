<line x1="460.5" y1="137.5" x2="472.5" y2="167.2" stroke="#9AA1AC" stroke-width="1" />
<text x="326.2" y="249.7" fill="#5B6472" font-size="15" text-anchor="middle" font-style="italic" >P<tspan baseline-shift="sub" font-size="11">i+1</tspan></text>
<text x="219.8" y="197.8" fill="#5B6472" font-size="15" text-anchor="middle" font-style="italic" >P<tspan baseline-shift="sub" font-size="11">C<tspan dy="3" font-size="9">i</tspan></tspan></text>
