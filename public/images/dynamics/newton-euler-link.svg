<circle cx="150.0" cy="250.0" r="9" fill="#ffffff" stroke="#1A1F2B" stroke-width="2"/>
<text x="148.0" y="332.0" fill="#1A1F2B" font-size="15" text-anchor="middle" font-style="italic" >{i}</text>
