<circle cx="309.1" cy="185.7" r="5.5" fill="#1A1F2B" stroke="#1A1F2B" stroke-width="2"/>
<text x="329.1" y="201.7" fill="#1A1F2B" font-size="14" text-anchor="middle" font-style="italic" >C<tspan baseline-shift="sub" font-size="11">i</tspan></text>
