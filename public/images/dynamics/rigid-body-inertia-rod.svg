<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Moment of inertia of a thin rod about its centre and about its end</title>
<desc>Two panels with the same uniform rod along X. Left: the Z axis passes through the centre of mass C; an element dx lies at distance x from it, with x from -L/2 to L/2, and the moment of inertia is mL^2/12. Right: the axis passes through the end A; the vector P_C of length L/2 goes from A to C, and the moment of inertia is mL^2/3, four times as much.</desc>
