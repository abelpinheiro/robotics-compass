<path d="M292,400 A80 80 0 0 0 281.3,360" fill="none" stroke="#9AA1AC" stroke-width="1.6"/>
<text x="330.0" y="382.0" fill="#5B6472" font-size="14" text-anchor="middle" font-style="italic" >θ<tspan baseline-shift="sub" font-size="11">1</tspan> = 30°</text>
<line x1="385.2" y1="300.0" x2="452.8" y2="261.0" stroke="#9AA1AC" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M430.2,274.0 A52 52 0 0 0 385.2,248.0" fill="none" stroke="#9AA1AC" stroke-width="1.6"/>
