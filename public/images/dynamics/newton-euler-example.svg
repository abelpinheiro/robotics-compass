<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Planar 2R arm of the worked example</title>
<desc>A planar 2R arm with theta1 = 30 and theta2 = 60 degrees, so that link 2 is vertical. Force f1 acts at joint 1 and f2 at joint 2, each with its components in the frame of its own link. The joint torques are 18.349 and 1.140 N m, both counterclockwise.</desc>
<defs><marker id="r" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#E2675F"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#16A34A"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563EB"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#D97706"/></marker><marker id="m" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#5B6472"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#DB2777"/></marker><marker id="k" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1A1F2B"/></marker></defs>
<rect width="640" height="450" fill="#ffffff"/>
<line x1="212.0" y1="400.0" x2="542.0" y2="400.0" stroke="#5B6472" stroke-width="1.4" marker-end="url(#m)"/>
<text x="558.0" y="405.0" fill="#5B6472" font-size="15" text-anchor="middle" font-style="italic" >X<tspan baseline-shift="sub" font-size="11">0</tspan></text>
<line x1="212.0" y1="400.0" x2="212.0" y2="70.0" stroke="#5B6472" stroke-width="1.4" marker-end="url(#m)"/>
<text x="194.0" y="78.0" fill="#5B6472" font-size="15" text-anchor="middle" font-style="italic" >Y<tspan baseline-shift="sub" font-size="11">0</tspan></text>
<line x1="212.0" y1="400.0" x2="385.2" y2="300.0" stroke="#CBD5E1" stroke-width="22" stroke-linecap="round"/>
<line x1="385.2" y1="300.0" x2="385.2" y2="140.0" stroke="#CBD5E1" stroke-width="22" stroke-linecap="round"/>
