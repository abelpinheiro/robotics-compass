<line x1="385.2" y1="300.0" x2="372.2" y2="260.5" stroke="#E2675F" stroke-width="2.8" marker-end="url(#r)"/>
<text x="370.2" y="248.5" fill="#E2675F" font-size="14" text-anchor="end" font-style="italic" >f<tspan baseline-shift="sub" font-size="11">2</tspan> = (7.891, 2.599) N</text>
<path d="M177.4,380.0 A40 40 0 0 0 201.6,438.6" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#b)"/>
<text x="162.0" y="414.0" fill="#2563EB" font-size="14" text-anchor="end" font-style="italic" >τ<tspan baseline-shift="sub" font-size="11">1</tspan> = 18.349 N·m</text>
<path d="M360.6,317.2 A30 30 0 0 0 411.2,315.0" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#b)"/>
<text x="419.2" y="332.0" fill="#2563EB" font-size="14" text-anchor="start" font-style="italic" >τ<tspan baseline-shift="sub" font-size="11">2</tspan> = 1.140 N·m</text>
<circle cx="298.6" cy="350.0" r="5.5" fill="#1A1F2B" stroke="#1A1F2B" stroke-width="2"/>
<text x="266.6" y="336.0" fill="#1A1F2B" font-size="15" text-anchor="start" font-style="italic" >C<tspan baseline-shift="sub" font-size="11">1</tspan></text>
