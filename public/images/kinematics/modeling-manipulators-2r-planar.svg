<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 38 290 330" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Modified (Craig) DH frame assignment for a 2R planar robot arm</title>
  <desc>Top-down view of a two-joint planar (2R) robot arm lying flat, with modified (Craig) DH frames. All joint axes point out of the plane (drawn as circled dots), so every twist alpha is zero, and every offset d is zero. Frames {0} and {1} share their origin and Z axis at joint 1: X0 is fixed and X1 runs along link 1, at angle theta1 from X0. Frame {2} sits at joint 2 with X2 along link 2, at angle theta2 from the X1 direction. The tool frame {T} sits at the tip. The link lengths appear as a1 = L1 and a2 = L2.</desc>

  <defs>
    <marker id="p2x" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#E2675F"/>
    </marker>
  </defs>

  <rect x="85" y="38" width="290" height="330" fill="#ffffff"/>

  <!-- links (gray bars): joint 1 -> joint 2 (a1) and joint 2 -> tool (a2) -->
  <line x1="120" y1="330" x2="268.4" y2="237.3" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <line x1="268.4" y1="237.3" x2="311.7" y2="104.2" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>

  <!-- X1 direction carried to joint 2 (dashed), the reference for theta_2 -->
  <line x1="268.4" y1="237.3" x2="324.4" y2="202.3" stroke="#E2675F" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- theta_1 arc at joint 1 : from X0 to X1, floated clear of both -->
  <path d="M159.8,326.5 A 40 40 0 0 0 156.3,313.1" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="169" y="317" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">1</tspan></text>

  <!-- theta_2 arc at joint 2 : from the X1 direction to X2, floated clear of both -->
  <path d="M298.7,214.4 A 38 38 0 0 0 285.6,203.4" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="298" y="197" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axes (red): X0 fixed; X1 along link 1; X2 along link 2; X_T at the tip -->
  <line x1="120" y1="330" x2="190" y2="330" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="120" y1="330" x2="198" y2="281.2" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="268.4" y1="237.3" x2="290" y2="170.7" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="311.7" y1="104.2" x2="329.6" y2="49" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>

  <!-- Z axes out of the plane (circled dots): {0}={1} at joint 1, {2} at joint 2, {T} at the tip -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <circle cx="120" cy="330" r="7.5"/>
    <circle cx="268.4" cy="237.3" r="7.5"/>
    <circle cx="311.7" cy="104.2" r="7.5"/>
  </g>
  <g fill="#2563EB">
    <circle cx="120" cy="330" r="2"/>
    <circle cx="268.4" cy="237.3" r="2"/>
    <circle cx="311.7" cy="104.2" r="2"/>
  </g>

  <!-- a_{i-1} = L labels, offset clear of the links -->
  <text x="236" y="288" fill="#D97706" font-size="16" font-style="italic">a<tspan baseline-shift="sub" font-size="11">1</tspan> = L<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="270" y="140" fill="#D97706" font-size="16" font-style="italic" text-anchor="end">a<tspan baseline-shift="sub" font-size="11">2</tspan> = L<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axis labels -->
  <text x="195" y="335" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <text x="186" y="272" fill="#E2675F" font-size="16" font-style="italic" text-anchor="end">X<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="271" y="190" fill="#E2675F" font-size="16" font-style="italic" text-anchor="end">X<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="336" y="56" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">T</tspan></text>

  <!-- Z / frame labels -->
  <text x="92" y="352" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">0</tspan> = Z<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="278" y="258" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="320" y="120" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">T</tspan></text>
</svg>
