<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 30 380 320" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DH frame assignment for a 2R planar robot arm</title>
  <desc>Top-down view of a two-joint planar (2R) robot arm lying flat. Both joint axes Z0, Z1, Z2 point out of the plane (drawn as circled dots), so the link twists alpha are zero; the frame origins sit at the joints, so the offsets d are zero. Link 1 has length a1 = L1 and link 2 has length a2 = L2, measured along the X axes. The joint angles theta1 (from X0 to X1 about Z0) and theta2 (from X1 to X2 about Z1) are the two variables.</desc>

  <defs>
    <marker id="p2x" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#E2675F"/>
    </marker>
  </defs>

  <rect x="70" y="30" width="380" height="320" fill="#ffffff"/>

  <!-- links (gray bars): O0->O1 (a1) and O1->O2 (a2) -->
  <line x1="110" y1="300" x2="281.5" y2="230.7" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <line x1="281.5" y1="230.7" x2="370.4" y2="103.7" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>

  <!-- theta_1 arc at O0 : from X0 (right) to link 1 -->
  <path d="M152,300 A 42 42 0 0 0 148.9,284.3" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="158" y="291" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">1</tspan></text>

  <!-- theta_2 arc at O1 : from X1 to link 2 -->
  <path d="M324.2,213.5 A 46 46 0 0 0 307.9,193" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="322" y="197" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axes (red), one per frame, along the outgoing link -->
  <line x1="110" y1="300" x2="180" y2="300" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="281.5" y1="230.7" x2="342.7" y2="206" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="370.4" y1="103.7" x2="406" y2="52.9" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>

  <!-- Z axes out of the plane (circled dots) at each joint -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <circle cx="110" cy="300" r="7.5"/>
    <circle cx="281.5" cy="230.7" r="7.5"/>
    <circle cx="370.4" cy="103.7" r="7.5"/>
  </g>
  <g fill="#2563EB">
    <circle cx="110" cy="300" r="2"/>
    <circle cx="281.5" cy="230.7" r="2"/>
    <circle cx="370.4" cy="103.7" r="2"/>
  </g>

  <!-- a_i = L_i labels on the links -->
  <text x="170" y="252" fill="#D97706" font-size="16" font-style="italic">a<tspan baseline-shift="sub" font-size="11">1</tspan> = L<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="342" y="150" fill="#D97706" font-size="16" font-style="italic">a<tspan baseline-shift="sub" font-size="11">2</tspan> = L<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axis labels -->
  <text x="184" y="298" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <text x="347" y="203" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="410" y="50" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- Z / frame labels -->
  <text x="86" y="320" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <text x="292" y="252" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="382" y="120" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">2</tspan></text>
</svg>
