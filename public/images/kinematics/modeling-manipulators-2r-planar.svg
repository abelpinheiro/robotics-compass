<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 38 290 330" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DH frame assignment for a 2R planar robot arm</title>
  <desc>Top-down view of a two-joint planar (2R) robot arm lying flat. Both joint axes Z0, Z1, Z2 point out of the plane (drawn as circled dots), so every twist alpha is zero; the frame origins sit at the joints, so every offset d is zero. Each X axis runs along its link, with link lengths a0 = L1 and a1 = L2, and the joint angles theta1 and theta2 are the two variables.</desc>

  <defs>
    <marker id="p2x" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#E2675F"/>
    </marker>
  </defs>

  <rect x="85" y="38" width="290" height="330" fill="#ffffff"/>

  <!-- links (gray bars): O0->O1 (a0) and O1->O2 (a1) -->
  <line x1="120" y1="330" x2="268.4" y2="237.3" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <line x1="268.4" y1="237.3" x2="311.7" y2="104.2" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>

  <!-- theta_1 arc at O0 : from X0 (right) to link 1, floated clear of both -->
  <path d="M159.8,326.5 A 40 40 0 0 0 156.3,313.1" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="169" y="317" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">1</tspan></text>

  <!-- theta_2 arc at O1 : from X1 to link 2, floated clear of both -->
  <path d="M298.7,214.4 A 38 38 0 0 0 285.6,203.4" stroke="#D97706" stroke-width="2" fill="none"/>
  <text x="298" y="197" fill="#D97706" font-size="17" font-style="italic">θ<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axes (red), one per frame, along the outgoing link -->
  <line x1="120" y1="330" x2="190" y2="330" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="268.4" y1="237.3" x2="324.4" y2="202.3" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>
  <line x1="311.7" y1="104.2" x2="329.6" y2="49" stroke="#E2675F" stroke-width="2.4" marker-end="url(#p2x)"/>

  <!-- Z axes out of the plane (circled dots) at each joint -->
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <circle cx="120" cy="330" r="7.5"/>
    <circle cx="268.4" cy="237.3" r="7.5"/>
    <circle cx="311.7" cy="104.2" r="7.5"/>
  </g>
  <g fill="#2563EB">
    <circle cx="120" cy="330" r="2"/>
    <circle cx="268.4" cy="237.3" r="2"/>
    <circle cx="311.7" cy="104.2" r="2"/>
  </g>

  <!-- a_i = L_i labels, offset clear of the links -->
  <text x="177" y="257" fill="#D97706" font-size="16" font-style="italic" text-anchor="middle">a<tspan baseline-shift="sub" font-size="11">0</tspan> = L<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="255" y="165" fill="#D97706" font-size="16" font-style="italic" text-anchor="end">a<tspan baseline-shift="sub" font-size="11">1</tspan> = L<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- X axis labels -->
  <text x="195" y="326" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <text x="330" y="200" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="335" y="46" fill="#E2675F" font-size="16" font-style="italic">X<tspan baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- Z / frame labels -->
  <text x="96" y="349" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">0</tspan></text>
  <text x="278" y="258" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="320" y="120" fill="#2563EB" font-size="16" font-style="italic">Z<tspan baseline-shift="sub" font-size="11">2</tspan></text>
</svg>
