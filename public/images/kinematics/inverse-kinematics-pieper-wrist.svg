<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 76 336 250" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pieper's criterion: spherical wrist and kinematic decoupling</title>
  <desc>A stylized 6-DOF industrial arm. The first three joints (1, 2, 3, in blue) form the positioning arm that brings the wrist centre W to the target point. The last three joints (4, 5, 6, in amber) form a spherical wrist: their three axes all intersect at the single point W, which is what Pieper's criterion requires for a closed-form solution. A rotation arrow at the wrist marks that joints 4 to 6 set the orientation. This decoupling splits the 6-DOF inverse-kinematics problem into a 3-DOF position problem (joints 1 to 3) and a 3-DOF orientation problem (joints 4 to 6).</desc>

  <defs>
    <marker id="prot" markerWidth="9" markerHeight="9" refX="6.5" refY="4.2" orient="auto">
      <path d="M0,0 L8,4.2 L0,8.4 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="72" y="76" width="336" height="250" fill="#ffffff"/>

  <!-- ground + base pedestal -->
  <line x1="84" y1="310" x2="138" y2="310" stroke="#64748B" stroke-width="2"/>
  <g stroke="#64748B" stroke-width="1.4">
    <line x1="90" y1="310" x2="84" y2="317"/>
    <line x1="99" y1="310" x2="93" y2="317"/>
    <line x1="108" y1="310" x2="102" y2="317"/>
    <line x1="117" y1="310" x2="111" y2="317"/>
    <line x1="126" y1="310" x2="120" y2="317"/>
    <line x1="135" y1="310" x2="129" y2="317"/>
  </g>
  <rect x="92" y="296" width="36" height="14" rx="2" fill="#CBD5E1" stroke="#64748B" stroke-width="1.4"/>

  <!-- positioning arm links (joints 1-3) -->
  <line x1="110" y1="296" x2="110" y2="232" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <line x1="110" y1="232" x2="205" y2="150" stroke="#475569" stroke-width="13" stroke-linecap="round"/>
  <line x1="205" y1="150" x2="315" y2="125" stroke="#475569" stroke-width="12" stroke-linecap="round"/>

  <!-- spherical wrist housing (joints 4-6) -->
  <circle cx="330" cy="123" r="21" fill="#FBEAD0" stroke="#E8C08A" stroke-width="1.2"/>

  <!-- the three wrist axes, all intersecting at W (dashed = axes, not links) -->
  <g stroke="#D97706" stroke-width="2.1" stroke-dasharray="6 4">
    <line x1="306.8" y1="130.1" x2="369.2" y2="115.9"/>
    <line x1="331.3" y1="93.8" x2="344.7" y2="152.3"/>
    <line x1="319.6" y1="104.5" x2="356.4" y2="141.5"/>
  </g>

  <!-- tool flange face at the end of the roll axis -->
  <line x1="363" y1="103.5" x2="375.5" y2="128.5" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- rotation arrow over the wrist: joints 4-6 set orientation -->
  <path d="M311.9,116 A27 27 0 0 1 353.5,100.9" stroke="#D97706" stroke-width="1.9" fill="none" marker-end="url(#prot)"/>

  <!-- wrist centre W (where the three axes meet) -->
  <circle cx="338" cy="123" r="6.5" fill="none" stroke="#D97706" stroke-width="2"/>
  <circle cx="338" cy="123" r="3.4" fill="#1A1F2B"/>

  <!-- positioning joints 1-3 (blue, numbered) -->
  <g>
    <circle cx="110" cy="296" r="9.5" fill="#ffffff" stroke="#2563EB" stroke-width="2.4"/>
    <circle cx="110" cy="232" r="9.5" fill="#ffffff" stroke="#2563EB" stroke-width="2.4"/>
    <circle cx="205" cy="150" r="9.5" fill="#ffffff" stroke="#2563EB" stroke-width="2.4"/>
  </g>
  <g fill="#2563EB" font-size="12" font-weight="600" text-anchor="middle">
    <text x="110" y="300">1</text>
    <text x="110" y="236">2</text>
    <text x="205" y="154">3</text>
  </g>

  <!-- axis / joint numbers for the wrist -->
  <g fill="#B45309" font-size="11" font-style="italic" text-anchor="middle">
    <text x="383" y="116">4</text>
    <text x="351" y="164">5</text>
    <text x="367" y="149">6</text>
  </g>

  <!-- W label -->
  <text x="320" y="113" fill="#1A1F2B" font-size="13" font-style="italic" text-anchor="end">W</text>
</svg>
