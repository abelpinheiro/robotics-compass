<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 402" width="100%" height="100%" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>General velocity of a point in a moving frame (Craig 5.13)</title>
  <desc>A fixed world frame A and a moving frame B whose origin translates with velocity A-V-Borg (blue) and rotates with angular velocity A-Omega-B (orange). A point Q sits at position r = B-Q inside frame B. The velocity of Q seen from A is the tip-to-tail sum of three contributions at Q: the origin translation A-V-Borg (blue), the motion of Q within B re-expressed in A (green), and the velocity induced by rotation A-Omega-B cross r, perpendicular to r (orange). Their vector sum is the total velocity A-V-Q (pink).</desc>

  <defs>
    <marker id="gvMut" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L7.5,4 L0,8 z" fill="#94A3B8"/></marker>
    <marker id="gvSl" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 z" fill="#475569"/></marker>
    <marker id="gvBl" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563EB"/></marker>
    <marker id="gvGr" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16A34A"/></marker>
    <marker id="gvOr" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D97706"/></marker>
    <marker id="gvPk" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/></marker>
    <marker id="gvDk" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto"><path d="M0,0 L8,4.2 L0,8.4 z" fill="#334155"/></marker>
  </defs>

  <rect x="0" y="0" width="620" height="402" fill="#ffffff"/>

  <!-- world frame {A} (fixed) -->
  <line x1="55" y1="358" x2="205" y2="358" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#gvMut)"/>
  <line x1="55" y1="358" x2="55" y2="180" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#gvMut)"/>
  <text x="211" y="362" font-size="12" font-style="italic" fill="#94A3B8">x<tspan baseline-shift="sub" font-size="8">A</tspan></text>
  <text x="46" y="176" font-size="12" font-style="italic" fill="#94A3B8">y<tspan baseline-shift="sub" font-size="8">A</tspan></text>
  <text x="60" y="374" font-size="12" font-style="italic" fill="#94A3B8">{A}</text>

  <!-- where {B} sits -->
  <line x1="55" y1="358" x2="200" y2="205" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- moving frame {B} -->
  <line x1="200" y1="205" x2="273.1" y2="172.4" stroke="#475569" stroke-width="1.7" marker-end="url(#gvSl)"/>
  <line x1="200" y1="205" x2="174" y2="146.5" stroke="#475569" stroke-width="1.7" marker-end="url(#gvSl)"/>
  <text x="279" y="171" font-size="12" font-style="italic" fill="#475569">x<tspan baseline-shift="sub" font-size="8">B</tspan></text>
  <text x="158" y="143" font-size="12" font-style="italic" fill="#475569">y<tspan baseline-shift="sub" font-size="8">B</tspan></text>
  <circle cx="200" cy="205" r="3" fill="#475569"/>
  <text x="186" y="222" font-size="12" font-style="italic" fill="#475569">O<tspan baseline-shift="sub" font-size="8">B</tspan></text>

  <!-- angular velocity of {B} -->
  <path d="M181.7,192.2 A22 22 0 1 1 176.1,214.9" stroke="#D97706" stroke-width="1.8" fill="none" marker-end="url(#gvOr)"/>
  <text x="150" y="188" text-anchor="end" font-size="12.5" font-style="italic" fill="#D97706"><tspan baseline-shift="super" font-size="8">A</tspan>Ω<tspan baseline-shift="sub" font-size="8">B</tspan></text>

  <!-- translation of B's origin -->
  <line x1="200" y1="205" x2="237.2" y2="155.4" stroke="#2563EB" stroke-width="2.4" marker-end="url(#gvBl)"/>

  <!-- position of Q inside {B}:  r = B_Q -->
  <line x1="200" y1="205" x2="340" y2="275" stroke="#334155" stroke-width="1.8" marker-end="url(#gvDk)"/>
  <text x="243" y="224" font-size="12.5" font-style="italic" fill="#334155">r = <tspan baseline-shift="super" font-size="8">B</tspan>Q</text>

  <!-- ===== the three velocity contributions at Q (tip to tail) ===== -->
  <!-- 1: origin translation -->
  <line x1="340" y1="275" x2="377.2" y2="225.4" stroke="#2563EB" stroke-width="2.6" marker-end="url(#gvBl)"/>
  <!-- 2: motion of Q within {B} -->
  <line x1="377.2" y1="225.4" x2="430.2" y2="201.8" stroke="#16A34A" stroke-width="2.6" marker-end="url(#gvGr)"/>
  <!-- 3: induced by rotation, perpendicular to r -->
  <line x1="430.2" y1="201.8" x2="453.4" y2="155.3" stroke="#D97706" stroke-width="2.6" marker-end="url(#gvOr)"/>
  <!-- resultant total -->
  <line x1="340" y1="275" x2="453.4" y2="155.3" stroke="#DB2777" stroke-width="3.2" marker-end="url(#gvPk)"/>

  <!-- point Q -->
  <circle cx="340" cy="275" r="4" fill="#DB2777"/>
  <text x="330" y="292" text-anchor="end" font-size="13" font-style="italic" font-weight="600" fill="#DB2777">Q</text>

  <!-- contribution labels -->
  <text x="332" y="248" text-anchor="end" font-size="12" font-style="italic" fill="#2563EB"><tspan baseline-shift="super" font-size="8">A</tspan>V<tspan baseline-shift="sub" font-size="8">BORG</tspan></text>
  <text x="437" y="223" font-size="12" font-style="italic" fill="#16A34A"><tspan baseline-shift="super" font-size="8">A</tspan><tspan baseline-shift="sub" font-size="8">B</tspan>R <tspan baseline-shift="super" font-size="8">B</tspan>V<tspan baseline-shift="sub" font-size="8">Q</tspan></text>
  <text x="466" y="166" font-size="12" font-style="italic" fill="#D97706"><tspan baseline-shift="super" font-size="8">A</tspan>Ω<tspan baseline-shift="sub" font-size="8">B</tspan> × r</text>
  <text x="392" y="246" font-size="13.5" font-style="italic" font-weight="600" fill="#DB2777"><tspan baseline-shift="super" font-size="9">A</tspan>V<tspan baseline-shift="sub" font-size="9">Q</tspan></text>

  <!-- colour-keyed equation -->
  <text x="310" y="392" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1A1F2B"><tspan font-weight="600" fill="#DB2777"><tspan baseline-shift="super" font-size="9">A</tspan>V<tspan baseline-shift="sub" font-size="9">Q</tspan></tspan> = <tspan fill="#2563EB"><tspan baseline-shift="super" font-size="9">A</tspan>V<tspan baseline-shift="sub" font-size="9">BORG</tspan></tspan> + <tspan fill="#16A34A"><tspan baseline-shift="super" font-size="9">A</tspan><tspan baseline-shift="sub" font-size="9">B</tspan>R <tspan baseline-shift="super" font-size="9">B</tspan>V<tspan baseline-shift="sub" font-size="9">Q</tspan></tspan> + <tspan fill="#D97706"><tspan baseline-shift="super" font-size="9">A</tspan>Ω<tspan baseline-shift="sub" font-size="9">B</tspan> × r</tspan></text>
</svg>
